name: check

on:
  pull_request:
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  # The status a pull request needs. It passes only when every leg below did.
  check:
    needs: [test, pack, image, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success && test "${{ needs.pack.result }}" = success && test "${{ needs.image.result }}" = success && test "${{ needs.browser.result }}" = success

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      # One platform failing shouldn't hide whether the others pass.
      fail-fast: false
      matrix:
        include:
          # The oldest Node muster runs on: the first whose SQLite it accepts.
          - { os: ubuntu-latest, node: '22.22.3' }
          - { os: ubuntu-latest, node: '24' }
          - { os: macos-latest, node: '24' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # The inspector and the templates, driven in a real browser.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openmuster/muster exec playwright install --with-deps chromium
      - run: pnpm test:browser

  # What a release does, without publishing: so a broken release step fails here, not on a tag.
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/release.mjs pack out
      - name: npm takes the tarball, without publishing it
        run: npm publish "./out/muster-$(node -p "require('./packages/muster/package.json').version").tgz" --access public --tag latest --dry-run
      - run: node scripts/release.mjs notes "$(node -p "require('./packages/muster/package.json').version")" > /dev/null

  # The container image builds, starts healthy, and serves the board it keeps on its volume.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t muster:check .
      - name: Run it and use it
        run: |
          docker run -d --name board -p 127.0.0.1:4100:4100 -v board-data:/data -e MUSTER_ALLOW_HOSTS=board.example.com muster:check
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4100/api/board/health && break; sleep 1; done
          docker logs board
          if docker logs board 2>&1 | grep -q 'mu1\.'; then echo "the log holds a token" >&2; exit 1; fi
          docker exec board mu post general "from the image"
          token=$(docker exec board mu token create --as ci --can 'general=read' --ttl 10m)
          curl -fs -H "Authorization: Bearer $token" http://127.0.0.1:4100/api/board/whoami
          docker exec board mu backup /data/check.db
          docker restart board
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4100/api/board/health && break; sleep 1; done
          # The volume kept the board and its key: the token made before the restart still works.
          curl -fs -H "Authorization: Bearer $token" http://127.0.0.1:4100/api/board/whoami
