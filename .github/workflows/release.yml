name: release

# A release is a tarball on GitHub, published to npm as @openmuster/muster. Pushing a tag vX.Y.Z whose
# number is the package's version checks the tree, packs packages/muster, and attaches the tarball
# twice (under its version, and as muster.tgz so releases/latest/download/muster.tgz works) with
# their checksums. muster is still alpha, so every release is "latest", an alpha or beta
# (0.3.1-alpha.1) included: that is the one the install line and releases/latest give.
on:
  push:
    tags: ['v*']

# Nothing here can write unless its job says so, and each job that can is given only what it publishes.
# Actions are pinned to a commit, and a checkout doesn't leave the job's token in the clone: the install,
# the build and the tests run code from every dependency, and none of it should be able to reach a release.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: The tag is the package's version
        run: |
          version=$(node -p "require('./packages/muster/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME is not package version v$version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack, install the tarball, run it, and write checksums
        run: node scripts/release.mjs pack out
      - name: Release notes from the changelog
        run: node scripts/release.mjs notes "$VERSION" > notes.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/muster-"$VERSION".tgz out/muster.tgz out/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag --latest

  # The same tarball on npm, as @openmuster/muster. The job holds no npm token: npm trusts this workflow
  # in this repository (trusted publishing) and takes the job's OIDC token. It runs no install and no
  # build, only npm on the file the release job attached, checked against the sums beside it.
  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tarball the release carries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "muster-$version.tgz" --pattern SHA256SUMS
          grep " muster-$version.tgz$" SHA256SUMS | sha256sum --check
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish
        # muster is still alpha, so an alpha is "latest" on npm as it is on GitHub: npm won't guess that for a prerelease.
        run: |
          npm --version
          npm publish "./muster-$VERSION.tgz" --access public --tag latest

  # The same release as a container image on GitHub's registry, tagged with its version and "latest".
  image:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/muster/package.json').version")
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          tags="-t $image:$version -t $image:latest"
          docker build --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" --label org.opencontainers.image.version="$version" $tags .
          # Signed in only once the image is built: the build runs the install, and needs no registry of ours.
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$image"
